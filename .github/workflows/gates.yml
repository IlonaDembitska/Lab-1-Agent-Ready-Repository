name: Gates

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.v.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: gate
        shell: bash
        run: npm run typecheck 2>&1 | tee gate-types.log
      - id: v
        if: ${{ !cancelled() }}
        run: echo "verdict=${{ steps.gate.outcome == 'success' && 'pass' || 'fail' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with: { name: gate-types, path: gate-types.log }

  lint:
    needs: types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.v.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: gate
        shell: bash
        run: npm run lint 2>&1 | tee gate-lint.log
      - id: v
        if: ${{ !cancelled() }}
        run: echo "verdict=${{ steps.gate.outcome == 'success' && 'pass' || 'fail' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with: { name: gate-lint, path: gate-lint.log }

  tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.v.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: gate
        shell: bash
        run: |
          npm test 2>&1 | tee gate-tests.log
          npx tsx scripts/validate-golden.ts docs/lab2/golden/queries.jsonl 2>&1 | tee -a gate-tests.log
      - id: v
        if: ${{ !cancelled() }}
        run: echo "verdict=${{ steps.gate.outcome == 'success' && 'pass' || 'fail' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with: { name: gate-tests, path: gate-tests.log }

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.v.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: gate
        shell: bash
        run: npm run build 2>&1 | tee gate-build.log
      - id: v
        if: ${{ !cancelled() }}
        run: echo "verdict=${{ steps.gate.outcome == 'success' && 'pass' || 'fail' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with: { name: gate-build, path: gate-build.log }

  verify:
    # Фінальна брама (крок 02): лише для гілок харнесу harness/t-NN-…, лише якщо всі чотири gates зелені.
    needs: [types, lint, tests, build]
    if: ${{ startsWith(github.head_ref || github.ref_name, 'harness/t-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.v.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: gate
        shell: bash
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx tsx scripts/harness/verifier.ts --branch "$BRANCH" --out verdict.json 2>&1 | tee gate-verify.log
      - id: v
        if: ${{ !cancelled() }}
        run: echo "verdict=${{ steps.gate.outcome == 'success' && 'pass' || 'fail' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-verify
          path: |
            gate-verify.log
            verdict.json
          if-no-files-found: ignore

  evals:
    # Регресійна брама evals (крок 04): агент проганяє кошик regression замороженого банку (k=1),
    # детерміновані оцінювачі ставлять вердикт, gate.ts порівнює задачі поіменно з базовим рівнем.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_VERSION: '1.19.0'
    outputs:
      verdict: ${{ steps.v.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Виконавець — OpenCode (та сама версія, що локально)
        run: npm install -g "opencode-ai@${OPENCODE_VERSION}" && opencode --version
      - name: Git-автор для комітів у worktree
        run: git config --global user.email "harness-ci@users.noreply.github.com" && git config --global user.name "harness-ci"
      - name: Прогрів OpenCode і перевірка моделі (перший запуск на чистому раннері мовчки довантажує залежності)
        timeout-minutes: 4
        shell: bash
        run: timeout 200 opencode run -m opencode/big-pickle "Відповідай одним словом: ок" || echo "прогрів не відповів — далі вирішить брама"
      - id: gate
        name: Банк regression, k=1, детерміновані оцінювачі, брама
        timeout-minutes: 15
        shell: bash
        env:
          EVAL_K: '1'
          EVAL_BUCKET: regression
          EVAL_LOG: evals-ci.jsonl
          HARNESS_BASE: HEAD
          # на чистому раннері перший хід довший, ніж локально: сторож простою 240 с замість 120 с
          HARNESS_IDLE_S: '240'
        run: |
          npx tsx scripts/evals/run-evals.ts docs/lab3/tasks.jsonl 2>&1 | tee gate-evals.log
          npx tsx scripts/evals/gate.ts 2>&1 | tee -a gate-evals.log
      - id: v
        if: ${{ !cancelled() }}
        run: echo "verdict=${{ steps.gate.outcome == 'success' && 'pass' || 'fail' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-evals
          path: |
            gate-evals.log
            evals-ci.jsonl
            evals-ci-summary.json
            runs/evals/**/run.json
            runs/evals/**/agent.log
            runs/evals/**/output.txt
          if-no-files-found: ignore

  record:
    needs: [types, lint, tests, build, verify, evals]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: gate-*, path: gate-logs, merge-multiple: true }
      - name: Запис вердиктів брам
        env:
          GATE_TYPES: ${{ needs.types.outputs.verdict || needs.types.result }}
          GATE_LINT: ${{ needs.lint.outputs.verdict || needs.lint.result }}
          GATE_TESTS: ${{ needs.tests.outputs.verdict || needs.tests.result }}
          GATE_BUILD: ${{ needs.build.outputs.verdict || needs.build.result }}
          GATE_VERIFY: ${{ needs.verify.outputs.verdict || needs.verify.result }}
          GATE_EVALS: ${{ needs.evals.outputs.verdict || needs.evals.result }}
        run: node scripts/harness/record-gates.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: gate-record
          path: |
            gate-record.json
            gate-run.json
            gate-logs/
